# Cross Creative — static site (no build step)
[build]
  publish = "."
  command = ""

# SPA-style section links (#work, #contact, etc.) are handled in-page;
# no redirect rules needed for this portfolio.

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
